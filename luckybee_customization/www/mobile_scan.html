{% extends "templates/web.html" %}

{% block page_content %}
<div class="container mt-5 mb-5 pb-5" style="max-width: 500px;">
    <h2 class="mb-4 text-center">Mobile Scan & Search</h2>
    
    <div id="scan-container" class="card p-3 shadow-sm mb-4 text-center">
        <h4>Scan Barcode</h4>
        <div id="scanner-wrapper" style="display: none; margin-bottom: 15px;">
            <div class="form-group text-left mb-2">
                <label for="camera-select">Select Camera:</label>
                <select id="camera-select" class="form-control"></select>
            </div>
            <!-- File input for headless testing -->
            <div class="input-group mb-2">
                <span class="input-group-text">Or Image:</span>
                <input type="file" accept="image/*" id="barcode-image-upload" class="form-control">
            </div>
            <video id="video-preview" style="width: 100%; border: 1px solid #ccc; border-radius: 8px;"></video>
        </div>
        <button id="start-scan-btn" class="btn btn-primary w-100">Start Camera</button>
        <button id="stop-scan-btn" class="btn btn-danger w-100" style="display: none;">Stop Camera</button>
    </div>

    <div class="card p-3 shadow-sm text-center">
        <h4>Manual Search</h4>
        <div class="input-group mt-3">
            <input type="text" id="search-input" class="form-control" placeholder="Name, code, or barcode...">
            <button id="search-btn" class="btn btn-secondary">Search</button>
        </div>
        <div id="search-alert" class="alert alert-danger mt-3" style="display: none;"></div>
    </div>
</div>

<script src="https://unpkg.com/@zxing/browser@0.1.3/umd/zxing-browser.min.js"></script>
<script>
frappe.ready(function() {
    const codeReader = new ZXingBrowser.BrowserMultiFormatReader();
    let controls = null;
    let selectedDeviceId = null;

    const videoElement = document.getElementById('video-preview');
    const startBtn = document.getElementById('start-scan-btn');
    const stopBtn = document.getElementById('stop-scan-btn');
    const cameraSelect = document.getElementById('camera-select');
    const scannerWrapper = document.getElementById('scanner-wrapper');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const searchAlert = document.getElementById('search-alert');
    const fileInput = document.getElementById('barcode-image-upload');

    // Register search events immediately to be safe
    searchBtn.addEventListener('click', () => {
        triggerSearch(searchInput.value.trim());
    });
    
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') triggerSearch(searchInput.value.trim());
    });

    // Helper to robustly get camera list from ZXing
    const getDevices = () => {
        try {
            if (typeof ZXingBrowser !== 'undefined') {
                if (ZXingBrowser.BrowserCodeReader && typeof ZXingBrowser.BrowserCodeReader.listVideoInputDevices === 'function') {
                    return ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
                }
                if (ZXingBrowser.BrowserMultiFormatReader && typeof ZXingBrowser.BrowserMultiFormatReader.listVideoInputDevices === 'function') {
                    return ZXingBrowser.BrowserMultiFormatReader.listVideoInputDevices();
                }
            }
            if (codeReader && typeof codeReader.listVideoInputDevices === 'function') {
                return codeReader.listVideoInputDevices();
            }
            if (codeReader && typeof codeReader.getVideoInputDevices === 'function') {
                return codeReader.getVideoInputDevices();
            }
        } catch (e) {
            console.error("ZXing device listing helper error:", e);
        }
        return Promise.reject("No compatible camera listing method found.");
    };

    // Populate cameras safely
    getDevices()
        .then(videoInputDevices => {
            if (videoInputDevices && videoInputDevices.length > 0) {
                selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;
                videoInputDevices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${device.deviceId}`;
                    cameraSelect.appendChild(option);
                });
            }
        })
        .catch(err => {
            console.warn("Initial device enumeration pending permission:", err);
        });

    cameraSelect.addEventListener('change', (e) => {
        selectedDeviceId = e.target.value;
        if (controls) {
            controls.stop();
            startScanning();
        }
    });

    const triggerSearch = (term) => {
        if (!term) return;
        searchBtn.disabled = true;
        searchBtn.innerText = "Searching...";
        searchAlert.style.display = "none";
        
        frappe.call({
            method: 'luckybee_customization.api.mobile_forms.find_item_for_mobile',
            args: { search_term: term },
            callback: function(r) {
                searchBtn.disabled = false;
                searchBtn.innerText = "Search";
                if (r.message && r.message.status === 'found') {
                    if (controls) controls.stop();
                    // Redirect to Web Form
                    window.location.href = r.message.redirect_url;
                } else {
                    searchAlert.innerText = "Item not found.";
                    searchAlert.style.display = "block";
                }
            },
            error: function() {
                searchBtn.disabled = false;
                searchBtn.innerText = "Search";
                searchAlert.innerText = "An error occurred during search.";
                searchAlert.style.display = "block";
            }
        });
    };

    const startScanning = async () => {
        searchAlert.style.display = "none";
        scannerWrapper.style.display = 'block';
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        
        try {
            const deviceIdToUse = selectedDeviceId || undefined;
            controls = await codeReader.decodeFromVideoDevice(
                deviceIdToUse,
                videoElement,
                (result, err) => {
                    if (result) {
                        if (controls) {
                            controls.stop();
                            controls = null;
                        }
                        stopBtn.style.display = 'none';
                        startBtn.style.display = 'block';
                        scannerWrapper.style.display = 'none';
                        const text = result.getText();
                        searchInput.value = text;
                        triggerSearch(text);
                    }
                }
            );
            
            // Populate camera select dropdown once permission is granted
            if (cameraSelect.options.length === 0) {
                getDevices().then(devices => {
                    if (devices && devices.length > 0) {
                        devices.forEach(d => {
                            const option = document.createElement('option');
                            option.value = d.deviceId;
                            option.text = d.label || `Camera ${d.deviceId.slice(0, 6)}`;
                            cameraSelect.appendChild(option);
                        });
                        if (!selectedDeviceId) {
                            selectedDeviceId = devices[devices.length - 1].deviceId;
                            cameraSelect.value = selectedDeviceId;
                        }
                    }
                }).catch(() => {});
            }
        } catch (e) {
            console.error("Camera scanning error:", e);
            searchAlert.innerText = "Camera error: " + (e.message || e);
            searchAlert.style.display = "block";
            scannerWrapper.style.display = 'none';
            stopBtn.style.display = 'none';
            startBtn.style.display = 'block';
        }
    };

    startBtn.addEventListener('click', startScanning);
    
    stopBtn.addEventListener('click', () => {
        if (controls) {
            controls.stop();
            controls = null;
        }
        scannerWrapper.style.display = 'none';
        stopBtn.style.display = 'none';
        startBtn.style.display = 'block';
    });

    // File input fallback for headless testing
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            try {
                const imgUrl = URL.createObjectURL(file);
                const result = await codeReader.decodeFromImageUrl(imgUrl);
                if (result) {
                    searchInput.value = result.getText();
                    triggerSearch(result.getText());
                } else {
                    searchAlert.innerText = "Could not decode barcode.";
                    searchAlert.style.display = "block";
                }
            } catch (err) {
                searchAlert.innerText = "Could not decode barcode.";
                searchAlert.style.display = "block";
                console.error(err);
            }
        }
    });
});
</script>
{% endblock %}
